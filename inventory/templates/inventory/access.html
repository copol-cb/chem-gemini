<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>접속 권한 확인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-4 fw-bold">🔐 보안 접속</h3>
        <p class="text-muted mb-4">부여받은 사업장 코드를 입력하세요.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="password" name="access_code" class="form-control form-control-lg text-center" placeholder="CODE 입력" required autofocus>
            </div>
            
            {% if error %}
            <div class="alert alert-danger py-2" role="alert" style="font-size: 0.9rem;">
                {{ error }}
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">입장하기</button>
        </form>
    </div>
</body>
</html>
