<!DOCTYPE html>
{% load static %}<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>화학물질 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-label-sm { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px; }
        .btn-add-row { background-color: #e2f0d9; color: #385723; border: 1px solid #385723; font-weight: bold; }
        .btn-add-row:hover { background-color: #c5e0b4; color: #385723; }
        
        /* [복구됨] 숫자 입력창 화살표(스핀버튼) 제거 */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* [유지] 제품 추가 버튼 스타일 (초록색 박스) */
        .btn-product-add {
            background-color: #fff;      
            color: #198754;              
            border: 2px solid #198754;   
            font-weight: bold;
            padding: 0.375rem 1rem;      
            transition: all 0.2s ease-in-out; 
        }
        .btn-product-add:hover {
            background-color: #198754;   
            color: #fff;                 
        }

        /* [유지] 제품 블록 간 구분선 */
        .product-block {
            padding-bottom: 15px; 
        }
        .product-block + .product-block {
            border-top: 3px solid #e9ecef; 
            padding-top: 25px;             
            margin-top: 15px;              
        }
        /* [NEW] Q&A 검색 버튼 커스텀 스타일 */
        .btn-qna-custom {
            display: flex;               /* 내부 요소 가로 정렬 */
            align-items: center;         /* 수직 중앙 정렬 */
            border: 1px solid #ced4da;   /* 회색 테두리 */
            border-radius: 50px;         /* 둥근 캡슐 모양 */
            background-color: white;     /* 흰색 배경 */
            padding: 5px 15px;           /* 내부 여백 */
            color: black;                /* 기본 글자색 */
            text-decoration: none;       /* 링크 밑줄 제거 */
            transition: all 0.2s ease-in-out; /* 부드러운 효과 */
        }
        .btn-qna-custom:hover {
            background-color: #f8f9fa;   /* 호버 시 약간 회색 배경 */
            border-color: #adb5bd;       /* 호버 시 테두리 진하게 */
            color: black;                /* 글자색 유지 */
        }
        .qna-title {
            font-weight: bold;           /* Q&A는 굵게 */
            font-size: 1.1rem;
            margin-right: 5px;
        }
        .qna-desc {
            color: #6c757d;              /* 회색 글자 */
            font-style: italic;          /* 기울임꼴 */
            font-size: 0.9rem;
            margin-left: 8px;            /* 아이콘과 간격 */
        }
    </style>
</head>
<body class="bg-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/list/">
    <img src="{% static 'logo.png' %}" alt="로고" width="45" height="45" class="me-2 bg-white rounded-circle p-1">
    화학물질 안전관리시스템
</a>
            <span class="text-white ms-3 badge bg-secondary">접속중: {{ current_user_site }}</span>
            <div class="navbar-nav ms-auto">
                <a class="btn-qna-custom ms-3" href="https://notebooklm.google.com/notebook/d4783d99-b22d-475c-a4f0-65fd8c9519f5?authuser=1" target="_blank">
                    <span class="qna-title">Q&A</span>
                    <span style="font-size: 1.1rem;">💡</span>
                    <span class="qna-desc">화학물질관리법과 관련한 궁금한 점을 검색!</span>
                </a>
                <a class="nav-link active" href="/add/">📝 신규 등록</a>
                <a class="nav-link" href="/list/">📋 관리 대장</a>
                <a class="nav-link text-danger ms-3" href="/logout/">🚪 로그아웃</a>
            </div>
        </div>
    </nav>

<div class="container pb-5">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="row mb-4 align-items-end bg-light p-3 rounded">
            
            {% if is_master %}
                <div class="col-md-2">
                    <label class="form-label-sm fw-bold">사업부 구분</label>
                    <select name="division" id="division-select" class="form-select form-select-sm" onchange="updateSites()" required>
                        <option value="">==선택하세요==</option>
                        <option value="제조본부">제조본부</option>
                        <option value="물류본부">물류본부</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label-sm fw-bold">사업장 구분</label>
                    <select name="site_name" id="site-select" class="form-select form-select-sm" required>
                        <option value="">==선택하세요==</option>
                    </select>
                </div>
            {% else %}
                <div class="col-md-4">
                    <label class="form-label-sm fw-bold">사업장 정보 (자동지정)</label>
                    <input type="text" class="form-control form-control-sm bg-white text-primary fw-bold" 
                           value="🏢 {{ user_division }} / {{ current_user_site }}" readonly disabled>
                </div>
            {% endif %}

            <div class="col-md-2">
                <label class="form-label-sm fw-bold">등록자</label>
                <input type="text" name="registrant" class="form-control form-control-sm" required placeholder="이름 입력">
            </div>

            <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-primary w-100" onclick="addProductBlock()">+ 제품 추가</button>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-primary w-100" onclick="addProductBlock()">+ 제품 추가</button>
                
                <button type="button" class="btn btn-sm btn-warning w-100 mt-1 fw-bold" onclick="fillRandomTestData()">🪄 테스트 자동 입력</button>
            </div>
        </div>


        <hr>

        <div id="product-list-area">
            
            <div class="product-block" data-index="0">
                <div class="row g-3">
                    
                    <div class="col-md-7">
                        <div class="row g-3">
                            <div class="col-md-12">
                                    <div class="row">
                                        
                                        <div class="col-md-6">
                                            <label class="form-label-sm">제품명</label>
                                            <div class="input-group input-group-sm">
                                                <input type="text" name="product_name_0" class="form-control" placeholder="==MSDS의 제품명 기준==" required>
                                                <button class="btn btn-outline-danger" type="button" onclick="removeProductBlock(this)">제품 삭제</button>
                                            </div>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label-sm text-danger fw-bold">MSDS 업로드 (PDF)</label>
                                            <div class="input-group input-group-sm">
                                                <input type="file" name="msds_file_0" class="form-control" accept=".pdf"> 
                                                       
                                                <button class="btn btn-outline-secondary" type="button" onclick="clearFileInput(this)">파일 삭제</button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            
                            <div class="col-md-6">
                                <label class="form-label-sm">성상</label>
                                <select name="state_0" class="form-select form-select-sm">
                                    <option value="">==선택하세요==</option>
                                    <option value="액체">액체</option>
                                    <option value="기체">기체</option>
                                    <option value="고체">고체</option>
                                    <option value="반고체">반고체</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label-sm">용도</label>
                                <div class="d-flex">
                                    <select name="usage_purpose_0" class="form-select form-select-sm me-2" onchange="toggleEtcInput(this)">
                                        <option value="">==선택하세요==</option>
                                        <option value="1. 원료 및 첨가제">1. 원료 및 첨가제</option>
                                        <option value="2. 공정보조물질">2. 공정보조물질</option>
                                        <option value="3. 시설/설비 유지보수">3. 시설/설비 유지보수</option>
                                        <option value="4. 시험용 시약">4. 시험용 시약</option>
                                        <option value="5. 폐수처리약품">5. 폐수처리약품</option>
                                        <option value="6. 보관/저장(운송업/창고업 해당)">6. 보관/저장</option>
                                        <option value="7. 기타">7. 기타</option>
                                    </select>
                                    <div class="etc-input-area d-none w-100">
                                        <input type="text" name="usage_detail_0" class="form-control form-control-sm" placeholder="기타 상세">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-12 mt-4"> 
                                <div class="d-flex align-items-center">
                                    <div class="form-check me-3" style="min-width: 110px;">
                                        <input class="form-check-input" type="checkbox" name="is_storage_0" id="chk_storage_0" onchange="toggleFacilityInputs(this)">
                                        <label class="form-check-label fw-bold text-danger border border-danger rounded px-2" for="chk_storage_0">저장시설</label>
                                    </div>
                                    <div class="row g-1 flex-grow-1 d-none facility-inputs">
                                        <div class="col-4">
                                            <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">시설 위치</label>
                                            <input type="text" name="storage_loc_0" class="form-control form-control-sm" placeholder="예: 폐수처리장">
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">시설 용량(m³)</label>
                                            <input type="number" step="0.0000001" name="storage_vol_0" class="form-control form-control-sm" placeholder="저장탱크 등 용량">
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">비중</label>
                                            <input type="number" step="0.0000001" name="specific_gravity_0" class="form-control form-control-sm" placeholder="제품의 비중">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 mt-2">
                                <div class="d-flex align-items-center">
                                    <div class="form-check me-3" style="min-width: 110px;">
                                        <input class="form-check-input" type="checkbox" name="is_keeping_0" id="chk_keeping_0" onchange="toggleFacilityInputs(this)">
                                        <label class="form-check-label fw-bold text-primary border border-primary rounded px-2" for="chk_keeping_0">보관시설</label>
                                    </div>
                                    <div class="row g-1 flex-grow-1 d-none facility-inputs">
                                        <div class="col-6">
                                            <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">보관 장소/시설</label>
                                            <input type="text" name="keeping_loc_0" class="form-control form-control-sm" placeholder="예: 분석실 캐비닛">
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">최대 보관량(kg)</label>
                                            <input type="number" step="0.0000001" name="keeping_max_0" class="form-control form-control-sm" placeholder="최대로 보관하는 양">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 mt-2">
                                <div class="d-flex align-items-center">
                                    <div class="form-check me-3" style="min-width: 110px;">
                                        <input class="form-check-input" type="checkbox" name="is_usage_0" id="chk_usage_0" onchange="toggleFacilityInputs(this)">
                                        <label class="form-check-label fw-bold text-success border border-success rounded px-2" for="chk_usage_0">사용시설</label>
                                    </div>
                                    
                                    <div class="row g-1 flex-grow-1 d-none facility-inputs">
                                        
                                        <div class="col-md-3">
                                            <div class="d-flex align-items-end mb-1" style="min-height: 35px;">
                                                <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">사용 장소/시설</label>
                                            </div>
                                            <input type="text" name="usage_loc_0" class="form-control form-control-sm" placeholder="예: 가열실 후라이어">
                                        </div>

                                        <div class="col-md-3">
                                            <div class="d-flex align-items-end mb-1" style="min-height: 35px;">
                                                <label class="form-label-sm text-muted mb-0" style="font-size:0.75rem;">1회 최대사용량(kg)</label>
                                            </div>
                                            <input type="number" step="0.0000001" name="usage_max_0" class="form-control form-control-sm" placeholder="최대사용량">
                                        </div>
                                        
                                        <div class="col-md-3">
                                            <div class="d-flex align-items-end mb-1" style="min-height: 35px;">
                                                <div class="d-flex align-items-center">
                                                    <input type="checkbox" class="form-check-input me-1" id="chk_water_0" style="width: 13px; height: 13px; margin-top:0;" onchange="toggleInputState(this)">
                                                    <label class="form-label-sm text-muted mb-0" for="chk_water_0" style="font-size:0.75rem; cursor: pointer; line-height: 1.2;">※희석 사용 시</label>
                                                </div>
                                            </div>
                                            <input type="number" step="0.0000001" name="water_input_0" class="form-control form-control-sm" placeholder="물 투입량(kg)" disabled>
                                        </div>

                                        <div class="col-md-3">
                                            <div class="d-flex align-items-end mb-1" style="min-height: 35px;">
                                                <div class="d-flex align-items-center">
                                                    <input type="checkbox" class="form-check-input me-1" id="chk_vol_0" style="width: 13px; height: 13px; margin-top:0;" onchange="toggleInputState(this)">
                                                    <label class="form-label-sm text-muted mb-0" for="chk_vol_0" style="font-size:0.75rem; cursor: pointer; line-height: 1.2;">※희석 사용 시<br>  수조가 있는 경우</label>
                                                </div>
                                            </div>
                                            <input type="number" step="0.0000001" name="usage_facility_vol_0" class="form-control form-control-sm" placeholder="수조 용량(㎥)" disabled>
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="col-md-5 border-start ps-4">
                        <label class="form-label-sm text-primary">구성 성분 정보 (MSDS 참조)</label>
                        
                        <div class="cas-container">
                            <div class="row g-2 mb-2 align-items-end">
                                <div class="col-6">
                                    <label class="form-label-sm">CAS No.</label>
                                    <input type="text" name="cas_no_0[]" class="form-control form-control-sm" placeholder="예: 7697-37-2">
                                </div>
                                <div class="col-4">
                                    <label class="form-label-sm">함량(%)</label>
                                    <input type="text" name="percentage_0[]" class="form-control form-control-sm" placeholder="함량" onchange="validatePercentage(this)">
                                </div>
                                <div class="col-2">
                                    <button type="button" class="btn btn-sm btn-add-row w-100" onclick="addCasRow(this, 0)">행 추가</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row mt-5">
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-dark px-5">최종 등록 및 저장</button>
            </div>
        </div>

    </form>
</div>

<script>
    // [중요] 사업부/사업장 데이터 (이 부분은 지우지 마세요!)
    var sites = {
        "제조본부": ["안산공장", "용인1공장", "용인2공장", "제천공장", "음성공장", "계룡공장", "구미공장", "양산공장"],
        "물류본부": ["동서울물류센터", "용인3물류센터", "호남물류센터", "양산2물류센터", "제주물류센터"]
    };

    function updateSites() {
        var divisionSelect = document.getElementById("division-select");
        var siteSelect = document.getElementById("site-select");
        var selectedDivision = divisionSelect.value;

        // 기존 옵션 초기화
        siteSelect.innerHTML = '<option value="">==선택하세요==</option>';

        if (selectedDivision in sites) {
            var availableSites = sites[selectedDivision];
            availableSites.forEach(function(site) {
                var option = document.createElement("option");
                option.value = site;
                option.text = site;
                siteSelect.appendChild(option);
            });
        }
    }

    // 1. 기타 입력창 토글
    function toggleEtcInput(selectElement) {
        var parentDiv = selectElement.parentElement;
        var etcInputArea = parentDiv.querySelector('.etc-input-area');
        if (selectElement.value === "7. 기타") {
            etcInputArea.classList.remove('d-none');
        } else {
            etcInputArea.classList.add('d-none');
            var inputField = etcInputArea.querySelector('input');
            if (inputField) inputField.value = '';
        }
    }

    // 2. 시설 체크박스 토글
    function toggleFacilityInputs(checkbox) {
        // 체크박스와 같은 부모(d-flex) 안에 있는 .facility-inputs 찾기
        var parentDiv = checkbox.closest('.d-flex'); 
        // 만약 구조가 복잡하면 더 상위에서 찾기
        if (!parentDiv) parentDiv = checkbox.parentElement.parentElement;
        
        var inputsDiv = parentDiv.querySelector('.facility-inputs');

        if (checkbox.checked) {
            inputsDiv.classList.remove('d-none');
        } else {
            inputsDiv.classList.add('d-none');
            // 꺼질 때 내부 값 초기화
            var inputs = inputsDiv.querySelectorAll('input');
            inputs.forEach(function(input) {
                input.value = '';
                if(input.type === 'checkbox') input.checked = false;
                if(input.disabled !== undefined) input.disabled = false; // 희석/수조 체크박스 로직 때문에 초기화 필요
            });
            // 희석/수조 disabled 상태 다시 잡기 (사용시설의 경우)
            if(checkbox.name.includes('is_usage')) {
                inputs.forEach(function(input) {
                   if(input.name.includes('water_input') || input.name.includes('usage_facility_vol')) {
                       input.disabled = true;
                   }
                });
            }
        }
    }

    // 3. 희석/수조 체크박스 토글 (활성화/비활성화)
    function toggleInputState(checkbox) {
        // 체크박스 바로 뒤나 근처에 있는 input[type=number] 찾기
        var parentCol = checkbox.closest('.col-md-3');
        var targetInput = parentCol.querySelector('input[type="number"]');
        
        if (checkbox.checked) {
            targetInput.disabled = false;
        } else {
            targetInput.disabled = true;
            targetInput.value = '';
        }
    }

    // 4. CAS 행 추가
    function addCasRow(btn, productIndex) {
        var container = btn.closest('.cas-container');
        var newRow = document.createElement('div');
        newRow.className = 'row g-2 mb-2 align-items-end';
        newRow.innerHTML = `
            <div class="col-6">
                <input type="text" name="cas_no_${productIndex}[]" class="form-control form-control-sm" placeholder="CAS No.">
            </div>
            <div class="col-4">
                <input type="text" name="percentage_${productIndex}[]" class="form-control form-control-sm" placeholder="함량" onchange="validatePercentage(this)">
            </div>
            <div class="col-2">
                <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="this.closest('.row').remove()">삭제</button>
            </div>
        `;
        container.appendChild(newRow);
    }

    // 5. 파일 입력 초기화 (NEW)
    function clearFileInput(btn) {
        var fileInput = btn.previousElementSibling;
        if (fileInput) {
            fileInput.value = '';
        }
    }

    // 6. 제품 블록 삭제
    function removeProductBlock(btn) {
        var block = btn.closest('.product-block');
        // 첫 번째 블록(기본 블록)은 내용은 지우되 삭제하지 않음 (선택사항)
        // 여기서는 그냥 다 삭제 가능하게 하고 인덱스 재정렬 하는 방식 대신,
        // 화면에서만 지우고 백엔드에서 처리하거나, 간단히 remove() 처리
        
        // 만약 전체 블록이 1개밖에 없으면 삭제 대신 초기화만
        var allBlocks = document.querySelectorAll('.product-block');
        if (allBlocks.length <= 1 && block.getAttribute('data-index') == '0') {

        }
        
        block.remove();
        updateListCount(); // 개수 업데이트
    }

    // 8. 총 제품 수 업데이트 (폼 전송용)
    function updateListCount() {
        var count = document.querySelectorAll('.product-block').length;
        // HTML 어딘가에 <input type="hidden" name="list_count" value="1"> 이 있어야 함.
        // 없으면 동적으로 만들어줌 (안전장치)
        var hiddenInput = document.querySelector('input[name="list_count"]');
        if (!hiddenInput) {
            hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'list_count';
            document.querySelector('form').appendChild(hiddenInput);
        }
        hiddenInput.value = count;
    }
    // [NEW] 함량 유효성 검사 (숫자 혼용 금지)
    function validatePercentage(input) {
        var val = input.value.trim();
        if (val === "") return;

        // 1. 숫자인지 확인 (소수점 포함)
        var isNumber = !isNaN(parseFloat(val)) && isFinite(val);
        
        // 2. 숫자가 아닌데, 숫자(0~9)가 섞여 있는지 확인 (예: "5이상", "약10")
        var hasDigit = /\d/.test(val);

        if (!isNumber && hasDigit) {
            alert("숫자와 문자를 섞어 쓸 수 없습니다.\n예) '5이상' (X), '5' (O), '영업비밀' (O)");
            input.value = ""; // 입력 초기화
            input.focus();
        }
    }
    // 페이지 로드 시 초기 실행
    document.addEventListener("DOMContentLoaded", function() {
        updateListCount();
    });
    // ==========================================
    // [NEW] 테스트용 데이터 랜덤 자동 입력 함수
    // ==========================================
    function fillRandomTestData() {
        // 1. 등록자 (비어있을 때만 채움)
        var regInput = document.querySelector('input[name="registrant"]');
        if (regInput && !regInput.value) {
            regInput.value = "테스터_" + Math.floor(Math.random() * 1000);
        }

        // 2. 화면에 있는 모든 '제품 블록'을 순회하며 채우기
        var blocks = document.querySelectorAll('.product-block');
        blocks.forEach(function(block) {
            var idx = block.getAttribute('data-index');

            // 제품명
            block.querySelector('input[name="product_name_' + idx + '"]').value = "랜덤화학제품_" + Math.floor(Math.random() * 10000);

            // 성상 (4개 중 1개 랜덤)
            var states = ["액체", "기체", "고체", "반고체"];
            block.querySelector('select[name="state_' + idx + '"]').value = states[Math.floor(Math.random() * states.length)];

            // 용도 (7개 중 1개 랜덤)
            var purposes = [
                "1. 원료 및 첨가제", "2. 공정보조물질", "3. 시설/설비 유지보수",
                "4. 시험용 시약", "5. 폐수처리약품", "6. 보관/저장(운송업/창고업 해당)", "7. 기타"
            ];
            var randomPurpose = purposes[Math.floor(Math.random() * purposes.length)];
            var purposeSelect = block.querySelector('select[name="usage_purpose_' + idx + '"]');
            purposeSelect.value = randomPurpose;
            
            // 용도 변경에 따른 기타창 열기(기존 함수 활용)
            toggleEtcInput(purposeSelect); 
            if (randomPurpose === "7. 기타") {
                block.querySelector('input[name="usage_detail_' + idx + '"]').value = "기타용도_" + Math.floor(Math.random() * 100);
            }

            // 헬퍼 함수: 시설 체크박스 랜덤 온오프 및 입력
            function fillFacility(type, isCheckName, locName, numNames) {
                var chk = block.querySelector('input[name="' + isCheckName + '"]');
                if (!chk) return;
                
                // 50% 확률로 체크
                chk.checked = Math.random() > 0.5; 
                toggleFacilityInputs(chk); // 기존 함수로 입력창 열기/닫기

                if (chk.checked) {
                    var locInput = block.querySelector('input[name="' + locName + '"]');
                    if (locInput) locInput.value = "테스트구역_" + Math.floor(Math.random() * 10);

                    numNames.forEach(function(name) {
                        var numInput = block.querySelector('input[name="' + name + '"]');
                        if (numInput && !numInput.disabled) {
                            numInput.value = (Math.random() * 99 + 1).toFixed(2); // 1~100 랜덤
                        }
                    });
                }
            }

            // 시설 정보 채우기 실행
            fillFacility('storage', 'is_storage_' + idx, 'storage_loc_' + idx, ['storage_vol_' + idx, 'specific_gravity_' + idx]);
            fillFacility('keeping', 'is_keeping_' + idx, 'keeping_loc_' + idx, ['keeping_max_' + idx]);
            
            // 사용시설은 조금 특이해서 따로 처리 (희석, 수조 체크박스 포함)
            var usageChk = block.querySelector('input[name="is_usage_' + idx + '"]');
            if (usageChk) {
                usageChk.checked = Math.random() > 0.5;
                toggleFacilityInputs(usageChk);
                if (usageChk.checked) {
                    block.querySelector('input[name="usage_loc_' + idx + '"]').value = "사용구역_" + Math.floor(Math.random() * 10);
                    block.querySelector('input[name="usage_max_' + idx + '"]').value = (Math.random() * 49 + 1).toFixed(2);

                    // 희석, 수조 랜덤 체크 (50% 확률)
                    var chkWater = block.querySelector('#chk_water_' + idx);
                    var chkVol = block.querySelector('#chk_vol_' + idx);
                    
                    if (chkWater) { chkWater.checked = Math.random() > 0.5; toggleInputState(chkWater); }
                    if (chkVol) { chkVol.checked = Math.random() > 0.5; toggleInputState(chkVol); }

                    if (chkWater && chkWater.checked) {
                        block.querySelector('input[name="water_input_' + idx + '"]').value = (Math.random() * 10 + 1).toFixed(2);
                    }
                    if (chkVol && chkVol.checked) {
                        block.querySelector('input[name="usage_facility_vol_' + idx + '"]').value = (Math.random() * 10 + 1).toFixed(2);
                    }
                }
            }

            // CAS No. 및 함량 세팅 (실제 테스트용 DB 데이터 샘플)
            var sampleCasList = ['1310-73-2', '7732-18-5', '50-00-0', '7697-37-2', '78-93-3'];
            var casInputs = block.querySelectorAll('input[name="cas_no_' + idx + '[]"]');
            var pctInputs = block.querySelectorAll('input[name="percentage_' + idx + '[]"]');

            casInputs.forEach(function(input, i) {
                input.value = sampleCasList[Math.floor(Math.random() * sampleCasList.length)];
                if (pctInputs[i]) {
                    // 함량: 0.01 ~ 99.99 사이 랜덤
                    pctInputs[i].value = (Math.random() * 99.98 + 0.01).toFixed(2);
                }
            });
        });
    }
